apiVersion: concord.dev/v1
kind: Control
metadata:
  id: hello-greeting
  title: Hello plugin returns a greeting
  framework: hello
  severity: low
spec:
  description: Smoke control that exercises the hello plugin's `greeting` evidence type.
  evidence:
    - id: greeting
      source: hello
      type: greeting
      params:
        name: concord
  policy:
    engine: rego
    file: ../policies/hello.rego
    package: concord.hello
